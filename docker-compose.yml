services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: multidrive
      POSTGRES_USER: multidrive_user
      POSTGRES_PASSWORD: multidrive_pass
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
